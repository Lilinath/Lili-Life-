<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lili Life</title>

<style>
:root{
  --pink:#e9abc4;
  --pink-light:#fde8f0;
  --blue:#acdced;
  --green:#b9dfc6;
  --lilac:#d8c9ee;
  --peach:#f6c59e;
  --yellow:#f4df91;
  --cream:#fffaf4;
  --white:#ffffff;
  --text:#514652;
  --border:#eadde4;
  --floor:#fff1df;
  --wall:#d7c2b5;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--cream);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

#app{
  min-height:100vh;
}

.screen{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:14px 14px 100px;
}

h1{
  font-size:29px;
  margin:0;
}

h2{
  font-size:21px;
  margin:0 0 10px;
}

h3{
  margin:0;
}

p{
  margin:0;
}

.muted{
  opacity:.68;
  font-size:13px;
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  padding:14px;
  margin-top:12px;
  box-shadow:0 8px 25px rgba(70,45,60,.06);
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.between{
  justify-content:space-between;
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.primary{
  width:100%;
  background:var(--pink);
  color:white;
  border-radius:14px;
  padding:13px 16px;
  font-weight:800;
}

.secondary{
  background:white;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:13px;
  padding:10px 13px;
}

.money{
  font-weight:900;
  font-size:18px;
}

/* =========================
   PERSONNAGE
========================= */

.preview{
  position:sticky;
  top:7px;
  z-index:20;
  background:#fff8fc;
  border:1px solid var(--border);
  border-radius:22px;
  padding:10px;
  margin-top:12px;
}

.previewStage{
  height:310px;
  border-radius:17px;
  background:linear-gradient(#fff9fc,#ffedf5);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* personnage humain 2D */

.person{
  position:relative;
  width:150px;
  height:250px;
  transform-origin:center bottom;
}

.head{
  position:absolute;
  left:45px;
  top:28px;
  width:60px;
  height:77px;
  background:#f0c6a5;
  border:2px solid #bd8d70;
  z-index:5;
}

.face1{
  border-radius:47% 47% 43% 43%;
}

.face2{
  border-radius:44% 48% 39% 45%;
}

.face3{
  border-radius:50% 43% 46% 40%;
}

.face4{
  border-radius:42% 50% 40% 47%;
}

.ear{
  position:absolute;
  top:56px;
  width:12px;
  height:21px;
  background:#efc3a1;
  border:2px solid #bd8d70;
  border-radius:50%;
  z-index:3;
}

.ear.left{
  left:40px;
}

.ear.right{
  right:40px;
}

.eye{
  position:absolute;
  top:55px;
  width:9px;
  height:12px;
  background:#453c43;
  border-radius:50%;
  z-index:8;
}

.eye.left{
  left:60px;
}

.eye.right{
  left:82px;
}

.brow{
  position:absolute;
  top:49px;
  width:15px;
  height:3px;
  background:#765a54;
  border-radius:3px;
  z-index:8;
}

.brow.left{
  left:57px;
  transform:rotate(-5deg);
}

.brow.right{
  left:80px;
  transform:rotate(5deg);
}

.nose{
  position:absolute;
  left:72px;
  top:64px;
  width:8px;
  height:11px;
  border-left:2px solid #bd8d70;
  border-bottom:2px solid #bd8d70;
  border-radius:0 0 0 6px;
  z-index:8;
}

.mouth{
  position:absolute;
  left:66px;
  top:82px;
  width:20px;
  height:7px;
  border-bottom:2px solid #9b5e6d;
  border-radius:0 0 50% 50%;
  z-index:8;
}

.hair{
  position:absolute;
  left:39px;
  top:19px;
  width:72px;
  height:58px;
  background:#5a4039;
  border:2px solid #76595a;
  border-radius:50% 50% 25% 25%;
  z-index:7;
}

.hair:after{
  content:"";
  position:absolute;
  left:5px;
  top:28px;
  width:12px;
  height:45px;
  background:inherit;
  border-radius:0 0 12px 12px;
  box-shadow:49px 0 0 currentColor;
}

.hair.short{
  height:48px;
}

.hair.long{
  height:68px;
  border-radius:48% 48% 35% 35%;
}

.hair.bob{
  height:63px;
  border-radius:48% 48% 28% 28%;
}

.hair.curly{
  border-radius:42%;
  box-shadow:
    0 0 0 5px rgba(80,50,50,.08),
    0 0 0 10px rgba(80,50,50,.04);
}

.body{
  position:absolute;
  left:42px;
  top:105px;
  width:66px;
  height:82px;
  background:var(--pink);
  border:2px solid #a86d83;
  border-radius:22px 22px 15px 15px;
  z-index:4;
}

.arm{
  position:absolute;
  top:112px;
  width:18px;
  height:74px;
  background:#f0c6a5;
  border:2px solid #bd8d70;
  border-radius:12px;
  z-index:3;
}

.arm.left{
  left:27px;
  transform:rotate(5deg);
}

.arm.right{
  right:27px;
  transform:rotate(-5deg);
}

.hand{
  position:absolute;
  top:176px;
  width:20px;
  height:20px;
  background:#f0c6a5;
  border:2px solid #bd8d70;
  border-radius:50%;
  z-index:5;
}

.hand.left{
  left:24px;
}

.hand.right{
  right:24px;
}

.leg{
  position:absolute;
  top:177px;
  width:23px;
  height:65px;
  background:#dca5a0;
  border:2px solid #a97976;
  border-radius:12px;
  z-index:2;
}

.leg.left{
  left:48px;
}

.leg.right{
  right:48px;
}

.shoe{
  position:absolute;
  top:228px;
  width:34px;
  height:15px;
  background:#766276;
  border-radius:12px;
  z-index:3;
}

.shoe.left{
  left:42px;
}

.shoe.right{
  right:42px;
}

/* enfants */

.child{
  transform:scale(.86);
}

.child .head{
  transform:scale(.82);
  transform-origin:center top;
}

.child .body{
  top:95px;
  height:65px;
}

.child .arm{
  top:102px;
  height:58px;
}

.child .hand{
  top:155px;
}

.child .leg{
  top:155px;
  height:55px;
}

.child .shoe{
  top:203px;
}

/* choix */

.choice{
  background:white;
  border:2px solid #eee0e7;
  border-radius:15px;
  padding:9px;
  min-height:66px;
  text-align:center;
}

.choice.selected{
  border-color:var(--pink);
  background:#fff3f8;
}

.faceChoice{
  height:105px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.miniPerson{
  transform:scale(.42);
}

.swatch{
  display:block;
  width:28px;
  height:28px;
  border-radius:50%;
  margin:0 auto 5px;
  border:1px solid #0002;
}

.sectionTitle{
  margin-top:12px;
}

/* =========================
   JEU
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:30;
  padding:7px 0;
  background:#fff9fcdd;
  backdrop-filter:blur(12px);
}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin-top:8px;
}

.stat{
  background:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:6px 4px;
  text-align:center;
  font-size:11px;
}

.bar{
  height:7px;
  background:#eee6e9;
  border-radius:9px;
  overflow:hidden;
  margin-top:4px;
}

.bar i{
  display:block;
  height:100%;
  border-radius:9px;
}

/* monde */

.game{
  height:calc(100vh - 205px);
  min-height:440px;
  overflow:hidden;
  position:relative;
  border-radius:24px;
  border:1px solid #d8cbd2;
  background:#cde7c5;
  touch-action:none;
  margin-top:8px;
}

.world{
  position:absolute;
  width:1200px;
  height:850px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:#cce7c5;
  touch-action:none;
}

.road{
  position:absolute;
  background:#e7e1e5;
  border:2px solid #d4ccd2;
  border-radius:20px;
}

.building{
  position:absolute;
  width:155px;
  height:120px;
  background:white;
  border:3px solid #9b8493;
  border-radius:22px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  box-shadow:0 8px 15px rgba(70,45,60,.08);
  z-index:5;
}

.building b{
  font-size:14px;
}

.building small{
  font-size:11px;
  opacity:.65;
}

.building button{
  background:var(--pink-light);
  padding:6px 9px;
  border-radius:9px;
  font-size:11px;
}

.supermarket{
  left:70px;
  top:90px;
}

.cafe{
  left:510px;
  top:80px;
}

.work{
  left:930px;
  top:100px;
}

.park{
  left:70px;
  top:520px;
}

.library{
  left:500px;
  top:520px;
}

.restaurant{
  left:920px;
  top:520px;
}

/* maison */

.house{
  position:absolute;
  left:350px;
  top:255px;
  width:500px;
  height:245px;
  background:var(--wall);
  border:10px solid #b59d92;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 15px 30px rgba(70,45,60,.14);
  z-index:4;
}

.house.rectangle{
  width:570px;
}

.house.lshape{
  width:550px;
  height:310px;
}

.house.inverted{
  width:550px;
  height:310px;
}

.house.floor{
  width:520px;
  height:270px;
}

.house.extension{
  width:620px;
}

.house.apartment{
  width:450px;
  height:250px;
}

.room{
  position:absolute;
  background:var(--floor);
  border:3px solid #bca99e;
  overflow:hidden;
}

.room span{
  position:absolute;
  top:6px;
  left:7px;
  background:#fff9;
  padding:3px 6px;
  border-radius:7px;
  font-size:11px;
  font-weight:800;
}

.living{
  left:0;
  top:0;
  width:55%;
  height:58%;
}

.kitchen{
  right:0;
  top:0;
  width:45%;
  height:58%;
}

.bedroom{
  left:0;
  bottom:0;
  width:45%;
  height:42%;
}

.bathroom{
  right:0;
  bottom:0;
  width:27%;
  height:42%;
}

.office{
  right:27%;
  bottom:0;
  width:28%;
  height:42%;
}

/* meubles */

.object{
  position:absolute;
  z-index:10;
  touch-action:none;
  user-select:none;
}

.obj-bed{
  width:100px;
  height:55px;
  background:#b6d3df;
  border:3px solid #7898a4;
  border-radius:10px;
}

.obj-sofa{
  width:95px;
  height:40px;
  background:#d7a9bd;
  border:3px solid #a9778e;
  border-radius:13px;
}

.obj-table{
  width:70px;
  height:45px;
  background:#c99f7d;
  border:3px solid #936d53;
  border-radius:8px;
}

.obj-shower{
  width:55px;
  height:55px;
  background:#bfe6ee;
  border:3px solid #759da7;
  border-radius:8px;
}

.obj-kitchen{
  width:95px;
  height:48px;
  background:#e7c7a8;
  border:3px solid #ad8968;
  border-radius:8px;
}

.obj-tv{
  width:58px;
  height:34px;
  background:#54505a;
  border:3px solid #35313a;
  border-radius:5px;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
}

.obj-storage{
  width:48px;
  height:58px;
  background:#d4b29a;
  border:3px solid #98725a;
  border-radius:6px;
}

.obj-door{
  width:15px;
  height:55px;
  background:#9d765d;
  border:2px solid #6e5142;
}

.obj-plant{
  font-size:35px;
}

/* personnages ville */

.cityPerson{
  position:absolute;
  width:50px;
  height:80px;
  z-index:15;
  transform:translate(-50%,-100%);
}

.cityHead{
  position:absolute;
  left:13px;
  top:0;
  width:24px;
  height:28px;
  border-radius:50%;
  background:#f0c6a5;
  border:2px solid #bd8d70;
}

.cityBody{
  position:absolute;
  left:9px;
  top:27px;
  width:32px;
  height:31px;
  border-radius:9px;
  background:var(--pink);
  border:2px solid #a86d83;
}

.cityArm{
  position:absolute;
  top:29px;
  width:8px;
  height:31px;
  background:#f0c6a5;
  border-radius:8px;
}

.cityArm.left{
  left:2px;
}

.cityArm.right{
  right:2px;
}

.cityLeg{
  position:absolute;
  top:55px;
  width:9px;
  height:24px;
  background:#dca5a0;
  border-radius:8px;
}

.cityLeg.left{
  left:12px;
}

.cityLeg.right{
  right:12px;
}

.npcName{
  position:absolute;
  top:80px;
  left:-10px;
  white-space:nowrap;
  background:white;
  padding:2px 5px;
  border-radius:7px;
  font-size:10px;
}

/* navigation */

.bottomNav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:60;
  background:white;
  border-top:1px solid var(--border);
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}

.bottomNav button{
  background:white;
  border-radius:12px;
  padding:7px 2px;
  font-size:11px;
}

.bottomNav button.active{
  background:var(--pink-light);
}

/* modal */

.modalBack{
  position:fixed;
  inset:0;
  background:rgba(50,38,48,.45);
  z-index:100;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modal{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:24px 24px 0 0;
  padding:16px 14px calc(20px + env(safe-area-inset-bottom));
}

.toast{
  position:fixed;
  left:50%;
  bottom:92px;
  transform:translateX(-50%);
  background:#514652;
  color:white;
  padding:10px 15px;
  border-radius:14px;
  z-index:200;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.toast.show{
  opacity:1;
}

@media(max-width:600px){
  .stats{
    grid-template-columns:repeat(5,1fr);
  }

  .stat{
    font-size:9px;
  }
}

@media(min-width:800px){
  .game{
    height:650px;
  }
}
</style>
</head>

  "Lucas","Inès","Jade","Adam","Lina"
];

/* =========================
   ÉTAT
========================= */

function newGame(){

  const skillState={};

  Object.keys(skills).forEach(k=>{
    skillState[k]=0;
  });

  return {
    version:11,

    screen:"creator",

    character:{
      gender:"femme",
      face:"face1",
      hair:"long",
      hairColor:"brun",
      outfit:"robe",
      outfitColor:"rose"
    },

    money:500,

    day:1,
    time:8,

    needs:{
      hunger:80,
      energy:85,
      hygiene:80,
      fun:75,
      social:65
    },

    skills:skillState,

    job:"developer",
    jobLevel:0,

    house:{
      type:null,
      locked:false,
      objects:[]
    },

    inventory:[],

    relationships:{},

    npcs:{},

    cityMessage:"Bienvenue dans Lili Life !",

    player:{
      x:600,
      y:610
    },

    modal:null
  };
}

function loadGame(){

  try{

    const saved=localStorage.getItem(SAVE_KEY);

    if(!saved){
      return newGame();
    }

    const data=JSON.parse(saved);

    if(!data || data.version!==11){
      return newGame();
    }

    return data;

  }catch(error){

    console.error("Erreur sauvegarde :",error);

    return newGame();
  }
}

let state=loadGame();

function saveGame(){

  try{
    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(state)
    );
  }catch(error){
    console.error(error);
  }
}

/* =========================
   UTILITAIRES
========================= */

function money(value){

  return Math.round(value).toLocaleString("fr-FR")+" €";

}

function clamp(value,min=0,max=100){

  return Math.max(min,Math.min(max,value));

}

function showToast(message){

  const el=document.getElementById("toast");

  if(!el)return;

  el.textContent=message;
  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    el.classList.remove("show");
  },1800);

}

function timeText(){

  const h=Math.floor(state.time);

  const minutes=state.time%1===0.5 ? "30" : "00";

  return String(h).padStart(2,"0")+":"+minutes;

}

function skillLevel(value){

  if(value<20)return 1;
  if(value<40)return 2;
  if(value<60)return 3;
  if(value<80)return 4;

  return 5;
}

function gainSkill(name,value){

  if(!(name in state.skills))return;

  state.skills[name]=clamp(
    state.skills[name]+value
  );

  checkPromotion();

}

function checkPromotion(){

  const job=jobs[state.job];

  if(!job)return;

  if(
    state.jobLevel<4 &&
    state.skills[job.skill]>=
    job.levels[state.jobLevel+1][2]
  ){

    state.jobLevel++;

    showToast(
      "🎉 Promotion : "+
      job.levels[state.jobLevel][0]
    );
  }
}

/* =========================
   TEMPS / BESOINS
========================= */

function advance(hours){

  state.time+=hours;

  while(state.time>=24){

    state.time-=24;
    state.day++;

  }

  state.needs.hunger=
    clamp(state.needs.hunger-hours*1.2);

  state.needs.energy=
    clamp(state.needs.energy-hours*.7);

  state.needs.hygiene=
    clamp(state.needs.hygiene-hours*.6);

  state.needs.fun=
    clamp(state.needs.fun-hours*.35);

  state.needs.social=
    clamp(state.needs.social-hours*.3);

  updateNPCSchedules();

  saveGame();

}

/* =========================
   PERSONNAGE HTML
========================= */

function characterHTML(c=state.character,mini=false){

  const child=
    c.gender.includes("enfant")
    ? "child"
    : "";

  const hairColor=
    hairColors[c.hairColor]||
    hairColors.brun;

  const clothes=
    outfitColors[c.outfitColor]||
    outfitColors.rose;

  let bodyRadius="";

  if(c.outfit==="robe"){
    bodyRadius="border-radius:22px 22px 10px 10px;";
  }

  return `
    <div class="person ${child}" style="
      ${mini?"transform:scale(.65);":""}
    ">

      <div class="ear left"></div>
      <div class="ear right"></div>

      <div class="head ${c.face}">
        <div class="brow left"></div>
        <div class="brow right"></div>

        <div class="eye left"></div>
        <div class="eye right"></div>

        <div class="nose"></div>
        <div class="mouth"></div>
      </div>

      <div
        class="hair ${c.hair}"
        style="
          background:${hairColor};
          color:${hairColor};
        "
      ></div>

      <div
        class="body"
        style="
          background:${clothes};
          ${bodyRadius}
        "
      ></div>

      <div class="arm left"></div>
      <div class="arm right"></div>

      <div class="hand left"></div>
      <div class="hand right"></div>

      <div class="leg left"></div>
      <div class="leg right"></div>

      <div class="shoe left"></div>
      <div class="shoe right"></div>

    </div>
  `;

}

/* =========================
   RENDU PRINCIPAL
========================= */

function render(){

  try{

    if(state.screen==="creator"){
      renderCreator();
      return;
    }

    if(state.screen==="house"){
      renderHouseChoice();
      return;
    }

    renderGame();

  }catch(error){

    console.error(error);

    document.getElementById("app").innerHTML=`
      <main class="screen">
        <div class="card">
          <h1>🌷 Lili Life</h1>
          <p style="margin-top:10px">
            Une erreur est survenue.
          </p>
          <button
            class="primary"
            style="margin-top:15px"
            onclick="resetGame()"
          >
            Recommencer
          </button>
        </div>
      </main>
    `;

  }

}

function setCharacter(key,value){

  state.character[key]=value;

  saveGame();

}

function finishCharacter(){

  saveGame();

  render();

}
