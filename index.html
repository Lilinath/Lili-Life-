<!doctype html>
<html lang="fr">
<head>

<title>Lili Life</title>

<style>
:root{
  --pink:#f3b5cc;
  --pink2:#ffe4ee;
  --blue:#b9ddf2;
  --green:#c4e7d2;
  --peach:#ffd1b8;
  --yellow:#ffe59a;
  --lilac:#d9c9ee;
  --cream:#fffaf5;
  --ink:#40383d;
  --muted:#897b82;
  --line:#eadde3;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{overflow-x:hidden}

button{
  font:inherit;
  color:inherit;
  cursor:pointer;
}

button:active{transform:scale(.98)}

#app{
  min-height:100vh;
  padding-bottom:90px;
}

.screen{
  width:min(100%,980px);
  margin:auto;
  padding:14px;
}

.card,.topbar{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 8px 25px #62445312;
}

h1,h2,h3,p{margin:0}
h1{font-size:28px}
h2{font-size:23px}
h3{font-size:17px}

.muted{
  color:var(--muted);
  font-size:13px;
}

.row{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}

.between{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.money{
  background:#fff0b5;
  padding:8px 11px;
  border-radius:13px;
  font-weight:800;
  white-space:nowrap;
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
}

.choice,.primary,.secondary{

  border-radius:15px;
  padding:11px;
  background:#fff;

.choice.selected{

}

.primary{
  background:var(--pink2);
  border-color:#edb3c9;
  font-weight:800;
}

.secondary{

/* ---------------- HOUSE ---------------- */

.house{

  top:50%;

  height:330px;

  border:12px solid #b99886;

  border-radius:10px;
}

.house.rectangle{
  width:760px;
}

.house.lshape{
  width:700px;
  height:350px;
  clip-path:polygon(
    0 0,
    68% 0,
    68% 30%,
    100% 30%,
    100% 100%,
    0 100%
  );
}

.house.inverted{
  width:700px;
  height:350px;
  clip-path:polygon(
    0 30%,
    32% 30%,
    32% 0,
    100% 0,
    100% 100%,
    0 100%

}

.house.floor{
  width:700px;
  height:360px;
}

.house.apartment{

/* ---------------- NAV / MODAL ---------------- */

.bottomNav{
  position:fixed;
  z-index:100;
  left:0;
  right:0;
  bottom:0;
  background:#fff;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:7px 7px max(7px,env(safe-area-inset-bottom));
  box-shadow:0 -5px 20px #0000000d;
}

.bottomNav button{
  border:0;
  background:transparent;
  border-radius:13px;
  padding:6px 2px;
  font-size:11px;

</style>
</head>

<body>

<script>
"use strict";

/* =========================================================

========================================================= */

const SAVE_KEY="lili-life-save-v12";

  journalist:{
    name:"Journaliste",
    skill:"writing",
    levels:[
      ["Stagiaire",60,0],
      ["Reporter",105,20],
      ["Journaliste",150,40],
      ["Senior",220,60],
      ["Grand reporter",300,80]
    ]
  }
};

const SKILLS={
  programming:"Programmation",
  logic:"Logique",
  creativity:"Créativité",
  reputation:"Réputation",
  medicine:"Médecine",
  precision:"Précision",
  pedagogy:"Pédagogie",
  knowledge:"Connaissances",
  cooking:"Cuisine",
  speed:"Vitesse",
  design:"Design",
  eloquence:"Éloquence",
  architecture:"Architecture",
  singing:"Chant",
  celebrity:"Célébrité",
  animals:"Animaux",
  writing:"Écriture",
  investigation:"Investigation",
  charisma:"Charisme",
  patience:"Patience"
};

const FURNITURE={
  bed:["Lit",120],
  sofa:["Canapé",90],
  table:["Table",55],
  shower:["Douche",80],
  kitchen:["Cuisine",160],
  tv:["Télévision",110],
  plant:["Plante",25],
  storage:["Rangement",45]
};

const HOUSE_TYPES=[
  ["square","Maison carrée",50],
  ["rectangle","Maison rectangle",80],
  ["lshape","Maison en L",120],
  ["inverted","Maison en L inversé",120],
  ["floor","Maison avec étage",180],
  ["apartment","Appartement",70]
];

const NPC_NAMES=[
  "Emma","Noah","Léa","Lucas",
  "Mia","Hugo","Zoé","Adam"
];

let S=loadGame();
let drag=null;

/* =========================================================
   SAVE
========================================================= */

function newGame(){
  const skills={};

  Object.keys(SKILLS).forEach(k=>{
    skills[k]=5;
  });

  return{
    screen:"creator",

    money:500,

    gender:"female",
    face:0,
    hair:0,
    hairColor:"#5b4034",
    outfit:0,
    outfitColor:"#f2abc6",

    day:1,
    time:8,

    needs:{
      hunger:82,
      energy:88,
      hygiene:84,
      fun:76,
      social:70
    },

    skills,

    job:"developer",
    jobLevel:0,

    house:{
      type:null,
      locked:false,
      objects:[]
    },

    inventory:[],

    player:{
      x:520,
      y:390
    },

    npcs:{},
    relationships:{},

    message:"Bienvenue dans Lili Life !",
    modal:null
  };
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);

    if(!raw){
      return newGame();
    }

    const old=JSON.parse(raw);
    return mergeState(newGame(),old);

  }catch(e){
    return newGame();
  }
}

function mergeState(base,data){
  if(!data || typeof data!=="object"){
    return base;
  }

  Object.keys(base).forEach(k=>{
    if(data[k]!==undefined){
      base[k]=data[k];
    }
  });

  base.needs=Object.assign(
    newGame().needs,
    data.needs||{}
  );

  base.skills=Object.assign(
    newGame().skills,
    data.skills||{}
  );

  base.house=Object.assign(
    newGame().house,
    data.house||{}
  );

  base.player=Object.assign(
    newGame().player,
    data.player||{}
  );

  return base;
}

function saveGame(){
  try{
    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(S)
    );
  }catch(e){}
}

/* =========================================================
   UTILITAIRES
========================================================= */

function clamp(v){
  return Math.max(0,Math.min(100,v));
}

function euro(v){
  return Math.round(v)+" €";
}

function timeText(){
  const h=Math.floor(S.time);
  const m=Math.round((S.time-h)*60);

  return String(h).padStart(2,"0")
    +":"+String(m%60).padStart(2,"0");
}

function skillLevel(value){
  return Math.min(
    5,
    Math.floor(value/20)+1
  );
}

function toast(text){
  const el=document.createElement("div");

  el.className="toast";
  el.textContent=text;

  document.body.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },1900);
}

function gainSkill(key,amount){
  if(S.skills[key]===undefined){
    return;
  }

  S.skills[key]=clamp(
    S.skills[key]+amount
  );

  checkPromotion();
}

function checkPromotion(){
  const job=JOBS[S.job];

  if(!job)return;

  while(
    S.jobLevel<4 &&
    S.skills[job.skill]>=
    job.levels[S.jobLevel+1][2]
  ){
    S.jobLevel++;
    S.message=
      "🎉 Promotion : "+
      job.levels[S.jobLevel][0]+" !";
  }
}

function advance(hours){
  S.time+=hours;

  while(S.time>=24){
    S.time-=24;
    S.day++;
  }

  S.needs.hunger=
    clamp(S.needs.hunger-3*hours);

  S.needs.energy=
    clamp(S.needs.energy-2.2*hours);

  S.needs.hygiene=
    clamp(S.needs.hygiene-1.8*hours);

  S.needs.fun=
    clamp(S.needs.fun-1.2*hours);

  S.needs.social=
    clamp(S.needs.social-.9*hours);

  updateNPCs();
  saveGame();
}

/* =========================================================
   DRAG MEUBLES
========================================================= */

function startFurnitureDrag(event,id){

  event.preventDefault();
  event.stopPropagation();

  const object=
    S.house.objects.find(
      x=>x.id===id
    );

  if(!object)return;

  drag={
    id,
    startX:event.clientX,
    startY:event.clientY,
    x:object.x,
    y:object.y
  };

  document.addEventListener(
    "pointermove",
    moveFurnitureDrag,
    {passive:false}
  );

  document.addEventListener(
    "pointerup",
    endFurnitureDrag,
    {once:true}
  );
}

function moveFurnitureDrag(event){

  if(!drag)return;

  event.preventDefault();

  const object=
    S.house.objects.find(
      x=>x.id===drag.id
    );

  if(!object)return;

  object.x=
    Math.max(
      5,
      Math.min(
        590,
        drag.x+
        event.clientX-
        drag.startX
      )
    );

  object.y=
    Math.max(
      5,
      Math.min(
        280,
        drag.y+
        event.clientY-
        drag.startY
      )
    );

  const element=
    document.querySelector(
      `[data-id="${object.id}"]`
    );

  if(element){

    element.style.left=
      object.x+"px";

    element.style.top=
      object.y+"px";

  }
}

function endFurnitureDrag(){

  document.removeEventListener(
    "pointermove",
    moveFurnitureDrag
  );

  saveGame();

  drag=null;
}

    S.house.objects.findIndex(

  S.inventory.push(

  else if(type==="kitchen"){

    S.needs.hunger=
      clamp(S.needs.hunger+35);

    advance(.5);

    S.message=
      "🍳 Tu as préparé à manger.";

  }

  else if(type==="tv"){

    S.needs.fun=
      clamp(S.needs.fun+30);

    advance(1);

    S.message=
      "📺 Tu regardes la télévision.";

  }

  else if(type==="sofa"){

    S.needs.fun=
      clamp(S.needs.fun+15);

    S.needs.social=
      clamp(S.needs.social+8);

  }

  const level=
    job.levels[S.jobLevel];

  S.money+=level[1];

  gainSkill(
    job.skill,
    7
  );

  S.needs.energy=
    clamp(S.needs.energy-15);

  S.needs.fun=
    clamp(S.needs.fun-7);

  S.message=
    "💼 Travail : +"+
    euro(level[1]);

  advance(4);

  saveGame();
  renderCity();

function getNPC(index){

  if(!S.npcs[index]){

    const homePositions=[
      [80,600],
      [280,610],
      [480,600],
      [680,610],
      [880,600],
      [180,500],
      [520,500],
      [820,500]
    ];

    const pos=
      homePositions[
        index%homePositions.length
      ];

    S.npcs[index]={

      id:index,

      name:NPC_NAMES[index],

      x:pos[0],
      y:pos[1],

      homeX:pos[0],
      homeY:pos[1],

      job:Object.keys(JOBS)
        [index%Object.keys(JOBS).length],

      status:"chez lui"

    };
  }

  return S.npcs[index];
}

function allNPCs(){

  return NPC_NAMES.map(
    (_,index)=>getNPC(index)
  );

}

function updateNPCs(){

  allNPCs().forEach((npc,index)=>{

    if(
      S.time>=8 &&
      S.time<16
    ){

      npc.x=
        600+
        (index%4)*55;

      npc.y=
        175+
        (index%2)*70;

      npc.status=
        "au travail";

    }

    else if(
      S.time>=16 &&
      S.time<21
    ){

      npc.x=
        350+
        (index%4)*110;

      npc.y=
        370+
        (index%2)*55;

      npc.status=
        "en ville";

    }

    else{

      npc.x=npc.homeX;
      npc.y=npc.homeY;

      npc.status=
        "chez lui";

    }

  });

}

function enableCityPan(){

  const city=
    document.getElementById("city");

  const world=
    document.getElementById("world");

  if(!city || !world)return;

  let moving=false;
  let startX=0;
  let startY=0;
  let originalX=0;
  let originalY=0;

  city.onpointerdown=e=>{

    if(
      e.target.closest(
        ".building,.npc"
      )
    ){
      return;
    }

    moving=true;

    startX=e.clientX;
    startY=e.clientY;

    originalX=world.offsetLeft;
    originalY=world.offsetTop;

    city.setPointerCapture(
      e.pointerId
    );
  };

  city.onpointermove=e=>{

    if(!moving)return;

    e.preventDefault();

    world.style.left=
      originalX+
      e.clientX-
      startX+
      "px";

    world.style.top=
      originalY+
      e.clientY-
      startY+
      "px";

  };

  city.onpointerup=()=>{
    moving=false;
  };

  city.onpointercancel=()=>{
    moving=false;
  };
}

========================================================= */

function cityAction(action){

  if(action==="shop"){

    if(S.money<25){
      toast(
        "Les courses coûtent 25 €."
      );
      return;
    }

    S.money-=25;

    S.needs.hunger=
      clamp(
        S.needs.hunger+25
      );

    S.message=
      "🛒 Tu as fait les courses.";

    advance(.5);

  }

  else if(action==="cafe"){

    if(S.money<6){
      toast(
        "Le café coûte 6 €."
      );
      return;
    }

    S.money-=6;

    S.needs.fun=
      clamp(
        S.needs.fun+18
      );

    S.needs.social=
      clamp(
        S.needs.social+15
      );

    S.message=
      "☕ Tu prends un café.";

    advance(.5);

  }

  else if(action==="restaurant"){

    if(S.money<18){
      toast(
        "Le restaurant coûte 18 €."
      );
      return;
    }

    S.money-=18;

    S.needs.hunger=
      clamp(
        S.needs.hunger+40
      );

    S.needs.fun=
      clamp(
        S.needs.fun+8
      );

    S.message=
      "🍽️ Tu manges au restaurant.";

    advance(1);

  }

  else if(action==="park"){

    S.needs.fun=
      clamp(
        S.needs.fun+22
      );

    S.needs.social=
      clamp(
        S.needs.social+8
      );

    S.message=
      "🌳 Tu te promènes dans le parc.";

    advance(.75);

  }

  else if(action==="library"){

    gainSkill(
      "knowledge",
      12
    );

    gainSkill(
      "logic",
      5
    );

    S.needs.energy=
      clamp(
        S.needs.energy-8
      );

    S.message=
      "📚 Tu étudies à la bibliothèque.";

    advance(1);

  }

  else if(action==="work"){

    work();
    return;

  }

  saveGame();
  renderCity();
}

  S.message=

function inviteNPC(id){

/* =========================================================
   RESET
========================================================= */

function resetGame(){

  if(
    !confirm(
      "Recommencer la partie ?"
    )
  ){
    return;
  }

  localStorage.removeItem(
    SAVE_KEY
  );

  S=newGame();

  render();
}

/* =========================================================
   RENDU
========================================================= */

function render(){

  try{

    if(S.screen==="creator"){
      renderCreator();
    }

    else if(
      S.screen==="houseChoice"
    ){
      renderHouseChoice();
    }

    else{
      renderGame();
    }

  }catch(error){

    console.error(
      "Erreur Lili Life:",
      error
    );

    document.getElementById(
      "app"
    ).innerHTML=`

      <div class="error">

        <h2>
          🌸 Lili Life
        </h2>

        <p
          style="margin-top:8px"
        >
          Une erreur est survenue.
        </p>

        <pre
          style="
            white-space:pre-wrap;
            font-size:12px
          "
        >${error.message}</pre>

        <button
          class="primary"
          style="
            margin-top:12px;
            width:100%;
            padding:12px
          "
          onclick="resetGame()"
        >
          Recommencer
        </button>

      </div>

    `;
  }
}

window.addEventListener(

render();
